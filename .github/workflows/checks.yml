name: Checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mxfood
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.16'
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          version: '0.13.5'
      - run: uv sync --locked
      - run: uv run --no-sync python -m unittest discover -s tests -v
